name: Node Express Firebase Docker Deploy

on:
  push: 
    branches:
      - staging

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "Set-Variable -Name '[System.Management.Automation.CommandCompletion]' -Value $null; . '{0}'"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

      - name: Install Dependencies
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npm install

        with:
          node-version: 22

      - name: Install Packages
        run: npm install

      - name: Run Tests
        run: npm test --if-present

      - name: Build Docker Image
        run: docker build -t node-firebase-api .

      - name: Verify Image
        run: docker images

      - name: Stop Existing Container
        run: docker compose down || true
        
      - name: Remove Old Images
        run: docker image prune -af

      - name: Build Docker Image
        run: docker compose build --no-cache

      - name: Start Container
        run: docker compose up -d

      - name: Verify Deployment
        run: docker ps